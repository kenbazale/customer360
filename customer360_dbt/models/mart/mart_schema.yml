version: 2

models:
  - name: customer_360
    description: >
      One row per customer. The unified view combining account activity,
      loan status, and digital engagement into business-ready risk and
      engagement signals. This is the model a marketing, risk, or
      relationship team would query directly.
    columns:
      - name: customer_id
        description: Primary key — every customer in this mart must have exactly one row.
        tests:
          - not_null
          - unique

      - name: dormancy_risk
        tests:
          - accepted_values:
              arguments:
                values: ['low', 'medium', 'high', 'unknown']

      - name: delinquency_status
        tests:
          - accepted_values:
              arguments:
                values: ['no_loan', 'current', 'watch', 'arrears', 'default_risk']

      - name: kyc_completeness_score
        tests:
          - accepted_values:
              arguments:
                values: [0, 50, 100]
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
                inclusive: true

      - name: engagement_score
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
                inclusive: true